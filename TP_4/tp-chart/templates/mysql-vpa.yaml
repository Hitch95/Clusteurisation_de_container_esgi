apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "tp-chart.fullname" . }}-mysql-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: StatefulSet
    name: mysql
  updatePolicy:
    # On le met en "Off" dans un premier temps pour qu'il donne juste des recommandations
    # sans tuer la base de données aléatoirement.
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: mysql
        minAllowed:
          cpu: 50m
          memory: 128Mi
        maxAllowed:
          cpu: "1"
          memory: 1Gi
        controlledResources: ["cpu", "memory"]
