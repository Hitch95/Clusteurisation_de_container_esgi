apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tp-chart.fullname" . }}-mysql
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.mysql.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  MYSQL_USER: {{ .Values.mysql.user | quote }}
  MYSQL_PASSWORD: {{ .Values.mysql.password | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tp-chart.fullname" . }}-config
data:
  DB_HOST: "mysql"
  DB_PORT: "3306"
  MYSQL_DATABASE: {{ .Values.mysql.database | quote }}
  MYSQL_USER: {{ .Values.mysql.user | quote }}
