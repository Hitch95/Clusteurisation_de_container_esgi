apiVersion: v1
kind: LimitRange
metadata:
  name: dev-limits
  namespace: app-dev
spec:
  limits:
    - type: Container
      default:          # valeurs appliquées si le pod ne déclare rien
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:   # requests par défaut
        cpu: "100m"
        memory: "128Mi"
      max:              # plafond absolu par container
        cpu: "1"
        memory: "1Gi"
      min:              # plancher (évite les containers sans limite)
        cpu: "50m"
        memory: "64Mi"
    - type: Pod
      max:
        cpu: "2"
        memory: "2Gi"
